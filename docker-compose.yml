services:
  portfolio-web:
    build:
      context: ./frontend/portfolio-web
      args:
        # Baked into the browser bundle at build time - must be the URL the browser
        # (on the host / internet) can reach, never a Docker-internal hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # Used for metadataBase, sitemap.xml, robots.txt, canonical/OG tags - set to the
        # real domain in production.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      # Runtime-only (no NEXT_PUBLIC_ prefix, so never sent to the browser). Lets
      # Server Components fetch the API over the Docker network by service name,
      # since "localhost:8080" inside this container doesn't reach portfolio-api.
      API_INTERNAL_URL: http://portfolio-api:8080
    ports:
      - "3000:3000"
    depends_on:
      - portfolio-api
    restart: unless-stopped

  portfolio-api:
    build:
      context: ./backend/Portfolio.Api
    ports:
      - "8080:8080"
    environment:
      XAI_API_KEY: ${XAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_URL: http://qdrant:6333
      PortfolioData__DataDirectory: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
