# No `ports:` here on purpose - this file is what Coolify deploys as-is (it runs
# `docker compose -f docker-compose.yml up`, an explicit -f that does NOT auto-merge
# docker-compose.override.yml). On a shared Coolify VPS, host-binding a fixed port
# (e.g. "8080:8080") fails outright if anything else on the box already holds it, and is
# unnecessary anyway - Coolify's own proxy routes by domain straight into this Docker
# network (configured per-service in Coolify's "Domains" tab), no host port needed.
# Local dev gets its ports back via docker-compose.override.yml, which plain
# `docker compose up` (no -f flag) merges in automatically.
services:
  portfolio-web:
    build:
      context: ./frontend/portfolio-web
      args:
        # Baked into the browser bundle at build time - must be the URL the browser
        # (on the host / internet) can reach, never a Docker-internal hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # Used for metadataBase, sitemap.xml, robots.txt, canonical/OG tags - set to the
        # real domain in production.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      # Runtime-only (no NEXT_PUBLIC_ prefix, so never sent to the browser). Lets
      # Server Components fetch the API over the Docker network by service name,
      # since "localhost:8080" inside this container doesn't reach portfolio-api.
      API_INTERNAL_URL: http://portfolio-api:8080
    depends_on:
      - portfolio-api
    restart: unless-stopped

  portfolio-api:
    build:
      context: ./backend/Portfolio.Api
    environment:
      XAI_API_KEY: ${XAI_API_KEY}
      PortfolioData__DataDirectory: /data
    volumes:
      - ./backend/Portfolio.Api/data:/data:ro
    restart: unless-stopped
