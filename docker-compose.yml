# Publishes fixed host ports (3000, 8080) below for local `docker compose up` convenience.
# NOTE: this is also what Coolify deploys as-is if the repo is connected directly - on a
# shared VPS, a fixed host-port bind fails outright if anything else on the box already
# holds that port (this happened once - see the "Fix Coolify deploy failure" commit).
# Coolify's own proxy can route by domain straight into the Docker network without needing
# a host port at all (its "Domains" tab, pointed at each service's internal port) - if you
# hit that same failure again, that's the fix: drop the `ports:` blocks below and configure
# domains in Coolify instead.
services:
  portfolio-web:
    build:
      context: ./frontend/portfolio-web
      args:
        # Baked into the browser bundle at build time - must be the URL the browser
        # (on the host / internet) can reach, never a Docker-internal hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # Used for metadataBase, sitemap.xml, robots.txt, canonical/OG tags - set to the
        # real domain in production.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      # Runtime-only (no NEXT_PUBLIC_ prefix, so never sent to the browser). Lets
      # Server Components fetch the API over the Docker network by service name,
      # since "localhost:8080" inside this container doesn't reach portfolio-api.
      API_INTERNAL_URL: http://portfolio-api:8080
    ports:
      - "3000:3000"
    depends_on:
      - portfolio-api
    restart: unless-stopped

  portfolio-api:
    build:
      context: ./backend/Portfolio.Api
    environment:
      XAI_API_KEY: ${XAI_API_KEY}
      PortfolioData__DataDirectory: /data
    volumes:
      - ./backend/Portfolio.Api/Data:/data:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
