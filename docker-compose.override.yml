# Local-dev-only additions, auto-merged by plain `docker compose up` (no -f flag) alongside
# docker-compose.yml - publishes host ports so you can reach the stack at localhost.
# Coolify is unaffected: it runs `docker compose -f docker-compose.yml up`, an explicit -f
# that skips this file entirely (see the comment at the top of docker-compose.yml).
services:
  portfolio-web:
    ports:
      - "3000:3000"

  portfolio-api:
    ports:
      - "8080:8080"

  qdrant:
    ports:
      - "6333:6333"
