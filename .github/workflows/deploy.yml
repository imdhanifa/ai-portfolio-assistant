name: Next.js CI/CD - GitHub Pages

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple deployments from running at the same time
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # ==========================================
  # CI - Install, Lint and Build
  # ==========================================
  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run lint if available
      - name: Run lint
        run: npm run lint
        continue-on-error: true

      # Build static Next.js application
      - name: Build Next.js
        run: npm run build

      # Upload generated static site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # ==========================================
  # CD - Deploy to GitHub Pages
  # ==========================================
  deploy:
    name: Deploy to GitHub Pages

    # Deploy only after successful build
    needs: build

    # Do not deploy for pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
