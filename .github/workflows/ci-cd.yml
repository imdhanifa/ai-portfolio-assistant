name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/Portfolio.Api/Portfolio.Api.csproj
      - name: Build
        run: dotnet build backend/Portfolio.Api/Portfolio.Api.csproj --configuration Release --no-restore

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/portfolio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/portfolio-web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build
        env:
          # Dummy values for a build-only check - no live backend needed (see lib/api.js,
          # every page fetches with cache: "no-store" so nothing is fetched at build time).
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  docker-build:
    name: Docker image builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend/Portfolio.Api
            tag: portfolio-api:ci
          - context: frontend/portfolio-web
            tag: portfolio-web:ci
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.tag }}
        run: |
          docker build -t ${{ matrix.tag }} \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080 \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            ${{ matrix.context }}

  e2e-smoke:
    name: docker-compose smoke test
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d
        env:
          # No real credentials needed: the app is designed to degrade gracefully
          # (Grok -> placeholder) when it isn't configured, which is exactly what this
          # smoke test exercises.
          XAI_API_KEY: ""
      - name: Wait for services to be healthy
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8080/health >/dev/null; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 2; done'
      - name: Run the Postman collection (newman)
        run: npx --yes newman run postman/Portfolio-Api.postman_collection.json --env-var baseUrl=http://localhost:8080
      - name: Check the homepage actually rendered real data
        run: curl -sf http://localhost:3000 | grep -q "Mohamed Hanifa"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy (Coolify)
    needs: [e2e-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "COOLIFY_WEBHOOK_URL is not set - skipping deploy trigger."
            echo "Two ways to enable deployment:"
            echo "  1) Set COOLIFY_WEBHOOK_URL (and optionally COOLIFY_API_TOKEN) in"
            echo "     GitHub repo Settings > Secrets and variables > Actions, so deploys"
            echo "     only fire after this pipeline's checks pass."
            echo "  2) Or skip this workflow's deploy job entirely and just connect this"
            echo "     GitHub repo directly in Coolify's dashboard - Coolify then polls"
            echo "     and redeploys on every push on its own, no secret needed."
            exit 0
          fi
          if [ -n "$COOLIFY_API_TOKEN" ]; then
            curl -fsSL -X POST "$COOLIFY_WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_API_TOKEN"
          else
            curl -fsSL -X POST "$COOLIFY_WEBHOOK_URL"
          fi
